<header class="cabecera">
    <a class="marca" href="{% url 'inicio' %}">Photobook<span>Comparte lo que te inspira</span></a>
    {% if usuario_actual %}
    <div class="cuenta"><a href="{% url 'perfil_detalle' usuario_actual.nombreUsuario %}">{{ usuario_actual.nombreUsuario }}</a>
    <form method="post" action="{% url 'cerrar_sesion' %}">{% csrf_token %}<button class="secundario">Cerrar sesión</button></form></div>
    {% else %}<div><a class="boton secundario" href="{% url 'iniciar_sesion' %}">Ingresar</a><a class="boton" href="{% url 'registrar_usuario' %}">Crear cuenta</a></div>{% endif %}
</header>
