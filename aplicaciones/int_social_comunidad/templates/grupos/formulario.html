{% extends 'base.html' %}
{% block contenido %}

<div class="encabezado_pagina">
  <div>
    <p class="sobre_titulo">{{ datos.accion|upper }}</p>
    <h1>{{ datos.accion|capfirst }} grupo</h1>
  </div>
</div>

<div class="formulario_doble">
  <form method="post" class="formulario">{% csrf_token %}
    <div class="campos_grupo">
      {% include 'componentes/campos.html' with formulario=datos.formulario %}
    </div>
    <button type="submit">Guardar</button>
    <button type="button" class="secundario" onclick="history.back()">Cancelar</button>
  </form>

  <aside class="vista_previa" aria-label="Vista previa del grupo">
    <p class="vista_titulo">VISTA PREVIA</p>
    <div class="previa_grupo">
      <div class="previa_portada" id="prev_portada"></div>
      <div class="previa_cuerpo">
        <span class="previa_avatar" id="prev_avatar" aria-hidden="true">··</span>
        <h2 id="prev_nombre">Nombre del grupo</h2>
        <p id="prev_desc">Aquí aparecerá la descripción.</p>
        <div class="previa_etiquetas">
          <span class="etiqueta" id="prev_tipo" hidden></span>
          <span class="etiqueta" id="prev_cat" hidden></span>
        </div>
      </div>
    </div>
  </aside>
</div>

<script>
(function () {
  var f = document.querySelector('form.formulario');
  if (!f) return;
  function campo(n) { return f.querySelector('[name="' + n + '"]'); }

  var nombre = campo('nombre'), desc = campo('descripcion'),
      tipo = campo('tipo'), cat = campo('categoria'),
      img = f.querySelector('[name*="imagen"]');

  var pAvatar = document.getElementById('prev_avatar'),
      pNombre = document.getElementById('prev_nombre'),
      pDesc = document.getElementById('prev_desc'),
      pTipo = document.getElementById('prev_tipo'),
      pCat = document.getElementById('prev_cat'),
      pPortada = document.getElementById('prev_portada');

  function textoSel(s) {
    return (s && s.value && s.selectedIndex >= 0) ? s.options[s.selectedIndex].text : '';
  }
  function etiqueta(el, texto) { el.textContent = texto; el.hidden = !texto; }

  function pintar() {
    var n = nombre ? nombre.value.trim() : '';
    pAvatar.textContent = n ? n.charAt(0).toUpperCase() + n.slice(1, 2).toLowerCase() : '··';
    pNombre.textContent = n || 'Nombre del grupo';
    pDesc.textContent = (desc && desc.value.trim()) || 'Aquí aparecerá la descripción.';
    etiqueta(pTipo, textoSel(tipo));
    etiqueta(pCat, textoSel(cat));
  }

  var espera;
  function portada() {
    clearTimeout(espera);
    espera = setTimeout(function () {
      var url = img ? img.value.trim() : '';
      pPortada.style.backgroundImage = '';
      if (!/^https?:\/\//i.test(url)) return;
      var prueba = new Image();
      prueba.onload = function () {
        if (img.value.trim() === url) pPortada.style.backgroundImage = 'url("' + encodeURI(url) + '")';
      };
      prueba.src = url;
    }, 400);
  }

  [nombre, desc].forEach(function (e) { if (e) e.addEventListener('input', pintar); });
  [tipo, cat].forEach(function (e) { if (e) e.addEventListener('change', pintar); });
  if (img) img.addEventListener('input', portada);

  pintar();
  portada();
})();
</script>

{% endblock %}
