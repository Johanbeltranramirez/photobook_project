{% extends 'base.html' %}{% block contenido %}<h1>{{ titulo }}</h1><a class="boton" href="{% url 'crear_rol' %}">Crear rol</a><div class="tabla"><table><thead><tr><th>Nombre</th><th>Descripcion</th><th>Activo</th><th>Opciones</th></tr></thead><tbody>{% for registro in registros %}<tr><td>{{ registro.nombre }}</td><td>{{ registro.descripcion }}</td><td>{{ registro.activo }}</td><td><a href="{% url 'actualizar_rol' registro.pk %}">Editar</a> · <a href="{% url 'eliminar_rol' registro.pk %}">Eliminar</a></td></tr>{% empty %}<tr><td>No hay registros.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
