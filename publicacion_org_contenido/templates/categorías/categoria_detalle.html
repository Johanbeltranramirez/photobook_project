{% extends 'base.html' %}{% block contenido %}{% with categoria=datos.categoria %}<h1>{{ categoria.nombre }}</h1><p>{{ categoria.descripcion|default:'' }}</p><a class="boton" href="{% url 'publicaciones_listar' %}?categoria={{ categoria.slug }}">Ver publicaciones</a>{% if permiso_contenido %}<a class="boton secundario" href="{% url 'categoria_actualizar' categoria.slug %}">Editar</a><a class="boton secundario" href="{% url 'categoria_eliminar' categoria.slug %}">Eliminar</a>{% endif %}{% endwith %}{% endblock %}
